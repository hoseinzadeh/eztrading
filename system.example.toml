name = "EZTrading System"

# Copy this file to `system.toml` (git-ignored) in the directory you start `srvman` from and edit
# it. Replace /path/to/eztrading with the absolute path of your checkout (see docs/cluster.md).
# Replace 127.0.0.1 with the server's address when running on several machines,
# and `user` with the account used to start the servers.

[system]
host = "127.0.0.1"

# The scoket port for command communication
port = 2022

# The scoket port for listening to the heartbeats
hb_port = 2023

# The scoket port for the http server
http_port = 8080

# HeartBeat Monitoring Settings
# The nubmer of seconds between each read to check if the server is alive
interval  = 30

# The number of seconds to call a server dead (shoud be a multiply of interval)
timeout = 300

[database]
host = "127.0.0.1"
port = 3306
user = "root"
pswd = "change-me" # your MySQL password

# srvman starts every server over SSH (key-based login to `user@host` must work), so use absolute
# paths in `exec`, `schlib`, `template` and `build_script`: they are resolved on the target machine.
# The user should be authorized in all servers
[servers.datasrv]
host = "127.0.0.1"
port = 2021
user = "your-user"
exec = "/path/to/eztrading/target/debug/datasrv"
# Your Twelve Data key (https://twelvedata.com). Omit this line to use the
# TWELVEDATA_API_KEY environment variable instead.
apikey = "YOUR_TWELVEDATA_API_KEY"
workspace = "/tmp/eztrading/data"
# Symbols streamed in real time (the data server subscribes to these; bots can only listen to them)
symbols = ["AAPL", "BTC/USD"]

[servers.jobsrv.1]
host = "127.0.0.1"
cap = 10
user = "your-user"
exec = "/path/to/eztrading/target/debug/jobsrv"
schlib = "/path/to/eztrading/package/common/scheduler.so" # .dylib on macOS

[servers.jobsrv.2]
host = "127.0.0.1"
cap = 5
user = "your-user"
exec = "/path/to/eztrading/target/debug/jobsrv"
schlib = "/path/to/eztrading/package/common/scheduler.so" # .dylib on macOS

[servers.jobsrv.3]
host = "127.0.0.1"
cap = 5
user = "your-user"
exec = "/path/to/eztrading/target/debug/jobsrv"
schlib = "/path/to/eztrading/package/common/scheduler.so" # .dylib on macOS

[servers.codesrv.1]
host = "127.0.0.1"
port = 2024
user = "your-user"
exec = "/path/to/eztrading/target/debug/codesrv"
workspace = "/tmp/eztrading/codesrv"
template = "/path/to/eztrading/package"
build_script = "/path/to/eztrading/pack.sh"

[servers.codesrv.2]
host = "127.0.0.1"
port = 2025
user = "your-user"
exec = "/path/to/eztrading/target/debug/codesrv"
workspace = "/tmp/eztrading/codesrv"
template = "/path/to/eztrading/package"
build_script = "/path/to/eztrading/pack.sh"